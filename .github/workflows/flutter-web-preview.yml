name: Deploy Flutter Web Preview

on:
  push:
    branches:
      - 'claude/**'
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'

      - name: Install dependencies
        working-directory: basketball_stats
        run: flutter pub get

      - name: Build preview (current branch)
        working-directory: basketball_stats
        run: flutter build web --base-href /preview/

      - name: Save preview build
        run: cp -r basketball_stats/build/web /tmp/preview-build

      - name: Checkout master for production build
        uses: actions/checkout@v4
        with:
          ref: master
          clean: false

      - name: Build production (master)
        working-directory: basketball_stats
        run: flutter build web --base-href /

      - name: Assemble combined site
        run: |
          mkdir -p _site
          cp -r basketball_stats/build/web/. _site/
          cp -r /tmp/preview-build _site/preview
          # CNAME must be at root
          cp basketball_stats/web/CNAME _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-preview
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
