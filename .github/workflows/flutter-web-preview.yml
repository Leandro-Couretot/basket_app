name: Deploy Flutter Web Preview

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'

      - name: Install dependencies
        working-directory: basketball_stats
        run: flutter pub get

      - name: Build web (preview)
        working-directory: basketball_stats
        run: flutter build web --base-href /preview/

      - name: Deploy preview to gh-pages subfolder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stash the built files
          cp -r basketball_stats/build/web /tmp/preview-build

          # Switch to gh-pages branch (already exists with production site)
          git fetch origin gh-pages
          git checkout gh-pages

          # Remove old preview and copy new build
          rm -rf preview
          cp -r /tmp/preview-build preview

          # Commit and push (only if there are changes)
          git add preview/
          git diff --cached --quiet || git commit -m "Deploy preview [skip ci]"
          git push origin gh-pages
