name: "Dashboard de Balance 📊"

# ─── TRIGGER ──────────────────────────────────────────────────────────────────
# Ejecutalo manualmente desde la UI: Actions → Dashboard de Balance → Run workflow
on:
  workflow_dispatch:
    inputs:
      balance:
        description: "Tu balance actual en ARS (ej: 1250000.50)"
        type: string
        required: true
      publicar_issue:
        description: "Crear/actualizar un Issue con el reporte"
        type: boolean
        default: true

# ─── JOBS ─────────────────────────────────────────────────────────────────────
jobs:

  # ── JOB 1 ──────────────────────────────────────────────────────────────────
  registrar-balance:
    name: "1 · Registrar balance en Google Sheets"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Escribir balance en el Sheet
        env:
          BALANCE: ${{ inputs.balance }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python write_balance.py

      - name: Resumen del paso
        run: |
          {
            echo "## ✅ Balance registrado"
            echo ""
            echo "| Campo | Valor |"
            echo "|:------|------:|"
            echo "| Balance | \`$${{ inputs.balance }}\` ARS |"
            echo "| Guardado en | Google Sheets |"
            echo "| Ejecutado por | @${{ github.actor }} |"
          } >> $GITHUB_STEP_SUMMARY

  # ── JOB 2 ──────────────────────────────────────────────────────────────────
  generar-reporte:
    name: "2 · Generar reporte histórico"
    runs-on: ubuntu-latest
    needs: registrar-balance  # espera a que el job 1 termine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Leer historial y generar reporte
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python report.py

      # El reporte completo aparece en la tab "Summary" del workflow
      - name: Mostrar reporte en el Summary
        run: cat report.md >> $GITHUB_STEP_SUMMARY

      # Archivo descargable desde la UI de Actions durante 90 días
      - name: Subir reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-run-${{ github.run_number }}
          path: report.md
          retention-days: 90

  # ── JOB 3 ──────────────────────────────────────────────────────────────────
  publicar-issue:
    name: "3 · Publicar Issue en GitHub"
    runs-on: ubuntu-latest
    needs: generar-reporte
    if: ${{ inputs.publicar_issue != false }}

    permissions:
      issues: write

    steps:
      - name: Descargar reporte
        uses: actions/download-artifact@v4
        with:
          name: reporte-run-${{ github.run_number }}

      - name: Crear label si no existe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "balance-report" \
            --color "0075ca" \
            --description "Reporte automático de balance" \
            --repo "${{ github.repository }}" 2>/dev/null || true

      - name: Crear o actualizar Issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="📊 Dashboard de Balance — Cocos Capital"
          BODY=$(cat report.md)

          EXISTING=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label "balance-report" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" \
              --repo "${{ github.repository }}" \
              --body "$BODY"
            echo "url=https://github.com/${{ github.repository }}/issues/$EXISTING" >> $GITHUB_OUTPUT
            echo "action=actualizado" >> $GITHUB_OUTPUT
          else
            URL=$(gh issue create \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --body "$BODY" \
              --label "balance-report")
            echo "url=$URL" >> $GITHUB_OUTPUT
            echo "action=creado" >> $GITHUB_OUTPUT
          fi

      - name: Resumen final
        run: |
          {
            echo "## 📋 Issue ${{ steps.issue.outputs.action }}"
            echo ""
            echo "➡️ [${{ steps.issue.outputs.url }}](${{ steps.issue.outputs.url }})"
          } >> $GITHUB_STEP_SUMMARY
